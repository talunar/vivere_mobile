name: vivere_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  go_router: ^17.2.0
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  fonts:
    - family: Golos Text
      fonts:
        - asset: assets/fonts/Golos-Text_Regular.ttf
        - asset: assets/fonts/Golos-Text_Medium.ttf
          weight: 500
        - asset: assets/fonts/Golos-Text_Bold.ttf
          weight: 700

  assets:
    - assets/design/  # Здесь будут картинки с тренеровками